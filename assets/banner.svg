<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Santiago Sanabria, Fundador y Arquitecto Operativo de Mantle Core Labs">
  <defs>
    <style>
      @font-face { font-family: "Geist"; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 500; src: url(data:font/woff2;base64,) format("woff2"); }
      .t { font-family: "Geist", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .s { animation-delay: 0.2s; }
      .line { stroke-dasharray: 1100; animation: draw 2.4s cubic-bezier(0.65, 0, 0.35, 1) 0.5s both; }
      .node { animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 2.7s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { from { stroke-dashoffset: 1100; } to { stroke-dashoffset: 0; } }
      @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .t, .line, .node { animation: none; } }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#707070"/>
      <stop offset="0.5" stop-color="#F5E9D0"/>
      <stop offset="1" stop-color="#F5E9D0"/>
    </linearGradient>
    <radialGradient id="fade" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </radialGradient>
    <clipPath id="panel"><rect width="1200" height="270" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="270" fill="#0A0A0A"/>
    <rect width="1200" height="270" fill="url(#grid)"/>
    <rect width="1200" height="270" fill="url(#fade)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="269" rx="15.5" fill="none" stroke="#2A2A2A"/>
  <text class="t" x="600" y="112" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="-2" fill="#FFFFFF">Santiago Sanabria</text>
  <text class="t s" x="600" y="156" text-anchor="middle" font-size="22" font-weight="500" fill="#C0C0C0">Fundador &amp; Arquitecto Operativo · Mantle Core Labs</text>
  <path class="line" d="M100.0 203.5 L110.1 219.0 L119.6 213.6 L131.1 192.6 L143.7 192.5 L155.7 194.5 L165.3 209.0 L180.1 197.9 L190.7 216.6 L206.3 214.6 L218.1 227.7 L227.4 223.4 L238.5 201.2 L248.3 206.4 L263.0 203.2 L276.1 215.6 L287.7 213.2 L297.1 201.5 L307.6 216.1 L319.5 208.0 L332.6 211.1 L343.7 217.5 L357.6 207.5 L370.7 212.4 L385.8 215.4 L396.8 218.5 L406.6 211.0 L420.9 208.0 L433.4 207.2 L447.0 214.4 L460.0 215.0 L471.2 213.4 L484.4 212.5 L496.6 213.8 L512.2 211.9 L525.9 210.5 L539.8 212.4 L555.7 212.5 L566.7 211.9 L580.4 211.8 L592.6 212.0 L600.0 212.0 L1100.0 212.0" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="node">
    <circle cx="1100" cy="212" r="10" fill="#4FD1FF" opacity="0.18"/>
    <circle cx="1100" cy="212" r="4.5" fill="#4FD1FF"/>
  </g>
</svg>
